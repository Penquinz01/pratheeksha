services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Host port 5433 to avoid clashing with any Postgres already on the host;
      # containers on the compose network still use db:5432.
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pratheeksha}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # Inside the compose network the DB is always db:5432, regardless of the
      # localhost URL used for local development in .env.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-pratheeksha}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-pratheeksha}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ../frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  pgdata:
